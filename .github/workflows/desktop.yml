# Builds the Vitalis Command desktop installers on real macOS and Windows machines
# (Tauri cannot cross-compile Windows installers from a Mac). Run it from the Actions tab,
# or push a tag like desktop-v0.1.0. Installers land under the run's Artifacts.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: ''
            rust_targets: ''
            bundle: |
              apps/web/src-tauri/target/release/bundle/msi/*.msi
              apps/web/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri
      - run: npm ci
      # The console talks to the production API; set these repository variables first.
      - run: npx tauri build ${{ matrix.args }}
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-command-${{ runner.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
