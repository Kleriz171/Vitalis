# Render's free plan puts the API to sleep after 15 minutes without requests, and waking
# takes about a minute. This pings it every 5 minutes from 07:00 to 23:00 Albania time.
# It sleeps at night on purpose: 750 free hours a month are shared by every free web
# service in the Render workspace, and 24/7 would use them all (~744 h).
# Scheduled workflows run from the default branch (main), and GitHub can delay them.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 5-21 * * *' # UTC; Albania is UTC+1 in winter, UTC+2 in summer
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 --retry 2 https://vitalis-api-7c3m.onrender.com/health
