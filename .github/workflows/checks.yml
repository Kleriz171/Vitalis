name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, builds, unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # same as local and EAS (apps/native/eas.json)
          cache: npm
      - run: npm ci
      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api
      - name: Typecheck app
        run: npx tsc --noEmit -p apps/native
      - name: Build web console and landing
        run: npm run build -w @vitalis/desktop && npm run build -w @vitalis/landing
      - name: Unit checks
        run: |
          npm run check:i18n
          npm run check:fall
          npm run check:voice
          npm run check:eta

  e2e:
    name: End-to-end API checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # turbodrone needs 3.10+, tested with 3.11
      - name: Toy-drone server (turbodrone) environment and protocol tests
        working-directory: apps/drone/turbodrone
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests
      - name: ffmpeg (the drone bridge records video with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Security, re-dispatch, check-in, SMS, drones
        run: scripts/e2e.sh
        env:
          MONGO_URI: mongodb://localhost:27017/vitalis_test
          PORT: 4000
          LOG_DIR: ${{ runner.temp }}/e2e-logs
      - name: Keep logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs

  wearos:
    # Wear OS app: heart-check unit tests and a debug build (the runner ships the Android SDK).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/watch/wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
