plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.vitalis'
version = '1.0.0'

android {
  namespace "expo.modules.keywordspotter"
  defaultConfig {
    consumerProguardFiles 'proguard-rules.pro'
  }
  // The .onnx models are already compressed; keep them stored so they load straight from the APK.
  androidResources { noCompress += ['onnx'] }
}

dependencies {
  // Offline keyword spotting, Apache-2.0. JitPack repo is added in app.json (expo-build-properties).
  implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8@aar'
}
