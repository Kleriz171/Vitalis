# Render blueprint for the API (test demo). Render → New → Blueprint → pick this repo and branch.
# The database is MongoDB Atlas (free M0): paste its connection string as MONGO_URI when asked.
services:
  - type: web
    name: vitalis-api
    runtime: node
    plan: free
    region: frankfurt # closest to Tirana
    buildCommand: npm ci -w @vitalis/api --include=dev && npm run build -w @vitalis/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS
        generateValue: true
      - key: JWT_REFRESH
        generateValue: true
      # Phone sign-in without SMS codes. Remove once Twilio (TWILIO_*) is set up.
      - key: DEMO_MODE
        value: "true"
      # Browsers allowed to call the API (desktop console, website). The phone app needs no entry.
      # tauri://localhost (macOS) and http://tauri.localhost (Windows) are the installed desktop app.
      - key: CORS_ORIGIN
        value: http://localhost:5173,http://localhost:5175,https://vitalis-web.onrender.com,tauri://localhost,http://tauri.localhost
      # Shared secret for drone bridges (apps/drone). Same value on every bridge.
      - key: DRONE_BRIDGE_KEY
        sync: false
      # Where certificate QR codes and the emergency contact's tracking link open.
      - key: PUBLIC_WEB_URL
        value: https://vitalis-web.onrender.com
      # Drone photos and videos (kept 30 days) go to MongoDB, capped at MEDIA_QUOTA_MB (default 300).
      # For Firebase Storage instead (Blaze plan): set MEDIA_BUCKET and upload the service-account
      # key as a Render Secret File named firebase-storage.json.
      - key: MEDIA_BUCKET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-storage.json

  # The website (apps/landing): certificate checks (/verify) and live SOS links (/track).
  - type: web
    name: vitalis-web
    runtime: static
    buildCommand: npm ci -w @vitalis/landing --include=dev && npm run build -w @vitalis/landing
    staticPublishPath: apps/landing/dist
    routes:
      - type: rewrite
        source: /verify/*
        destination: /index.html
      - type: rewrite
        source: /track/*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://vitalis-api-7c3m.onrender.com/api
