# Render blueprint for the API (test demo). Render → New → Blueprint → pick this repo and branch.
# The database is MongoDB Atlas (free M0): paste its connection string as MONGO_URI when asked.
services:
  - type: web
    name: vitalis-api
    runtime: node
    plan: free
    region: frankfurt # closest to Tirana
    buildCommand: npm ci -w @vitalis/api --include=dev && npm run build -w @vitalis/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS
        generateValue: true
      - key: JWT_REFRESH
        generateValue: true
      # Phone sign-in without SMS codes. Remove once Twilio (TWILIO_*) is set up.
      - key: DEMO_MODE
        value: "true"
      # Browsers allowed to call the API (website, installed desktop app). The phone app needs no entry.
      # tauri://localhost (macOS) and http://tauri.localhost (Windows) are the installed desktop app.
      # Local dev servers are left out on purpose; develop against a local API.
      - key: CORS_ORIGIN
        value: https://vitalis-web.onrender.com,tauri://localhost,http://tauri.localhost
      # Shared secret for drone bridges (apps/drone). Same value on every bridge.
      - key: DRONE_BRIDGE_KEY
        sync: false
      # Shared secret connected defibrillator cabinets send with battery and door reports.
      # Unset = cabinet reports off; batteries are typed in at inspection.
      - key: AED_DEVICE_KEY
        sync: false
      # Where certificate QR codes and the emergency contact's tracking link open.
      - key: PUBLIC_WEB_URL
        value: https://vitalis-web.onrender.com
      # Drone photos and videos (kept 30 days) go to MongoDB, capped at MEDIA_QUOTA_MB (default 300).
      # For Firebase Storage instead (Blaze plan): set MEDIA_BUCKET and upload the service-account
      # key as a Render Secret File named firebase-storage.json.
      - key: MEDIA_BUCKET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-storage.json

  # The website (apps/landing): certificate checks (/verify) and live SOS links (/track).
  - type: web
    name: vitalis-web
    runtime: static
    buildCommand: npm ci -w @vitalis/landing --include=dev && npm run build -w @vitalis/landing
    staticPublishPath: apps/landing/dist
    # Render already sends HSTS and nosniff. The page's own Content-Security-Policy is in its HTML
    # (vite.config.ts); framing is refused here because a <meta> policy cannot do that.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
    # /privacy and /terms are real files (the build copies the page), so they need no rewrite.
    routes:
      - type: rewrite
        source: /verify/*
        destination: /index.html
      - type: rewrite
        source: /track/*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://vitalis-api-7c3m.onrender.com/api
      # The site's own address (custom domain later): share images and canonical links use it.
      - key: VITE_SITE_URL
        value: https://vitalis-web.onrender.com
      # Partnerships inbox for "Talk to us". Unset = the button is hidden.
      - key: VITE_PARTNERS_EMAIL
        sync: false
